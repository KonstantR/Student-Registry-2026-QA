name: CI - Student Registry (Node.js) 
 
on: 
  push: 
  pull_request: 
 
jobs: 
  validate: 
    runs-on: ubuntu-latest
 
    steps: 
      - name: Checkout 
        uses: actions/checkout@v4
 
      - name: Set up Node.js 
        uses: actions/setup-node@v4
        with: 
          node-version: 24.x
          cache: npm
 
      - name: Install dependencies 
        run: npm ci
 
      - name: Check application syntax 
        run: node --check index.js
 
  test: 
    needs: validate
    runs-on: ubuntu-latest 
 
    steps: 
      - name: Checkout 
        uses: actions/checkout@v4 
 
      - name: Set up Node.js 
        uses: actions/setup-node@v4 
        with: 
          node-version: 24.x 
          cache: npm 
 
      - name: Install dependencies 
        run: npm ci 
 
      - name: Start app (background) 
        run: npm start & 
 
      - name: Wait for app to be ready 
        run: npx --yes wait-on http://localhost:8080 
 
      - name: Run tests 
        run: npm test

  verify-dependencies: 
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install dependencies
        run: npm ci

      - name: Verify dependency tree
        run: npm ls --depth=0